<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=1080"><title>¿NOS ROMPEN LOS HUEVOS?</title><style>
:root{--cream:#F3EDE0;--green:#35512A;--brown:#7A4A22;--kraft:#E9DFC9;--white:#FFFFFF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:var(--cream);overflow:hidden}
body{font-family:Arial,sans-serif;color:var(--green)}
.story{width:1080px;height:1920px;display:flex;flex-direction:column;padding:300px 80px 250px;background:var(--cream);position:relative}
.eyebrow{font-family:Arial,sans-serif;font-weight:700;font-size:34px;letter-spacing:10px;color:var(--brown);text-align:center}
.headline{font-weight:700;margin-top:34px;font-size:118px;line-height:1.02;text-align:center;text-transform:uppercase;color:var(--green)}
.sub{margin-top:30px;font-family:Arial,sans-serif;font-weight:700;font-size:50px;text-align:center;color:var(--brown)}
.photo{margin-top:50px;width:920px;height:520px;border-radius:40px;object-fit:cover;display:block;align-self:center;box-shadow:0 18px 40px rgba(53,81,42,.18)}
.body{margin-top:50px;display:flex;flex-direction:column;align-items:center;gap:26px}
.pill{background:var(--green);color:var(--white);font-family:Arial,sans-serif;font-weight:700;font-size:48px;padding:26px 48px;border-radius:999px;text-align:center}
.cards{display:flex;gap:30px;width:920px}
.card{flex:1;background:var(--white);border-radius:34px;padding:40px 24px;text-align:center;border:4px solid var(--kraft)}
.card .k{font-size:50px;color:var(--green)}
.card .n{font-family:Arial,sans-serif;font-weight:700;font-size:34px;color:var(--brown);margin-top:10px}
.card .p{font-size:96px;color:var(--brown);margin-top:14px;line-height:1}
.card .u{font-family:Arial,sans-serif;font-weight:700;font-size:30px;color:var(--green);margin-top:10px}
.cta{margin-top:44px;text-align:center}
.cta span{display:inline-block;background:var(--brown);color:var(--white);font-family:Arial,sans-serif;font-weight:700;font-size:52px;padding:30px 60px;border-radius:999px}
.foot{position:absolute;left:0;right:0;bottom:120px;text-align:center;font-family:Arial,sans-serif;font-weight:700;font-size:34px;letter-spacing:4px;color:var(--brown)}
</style></head>
<body><div class="story">
<div class="eyebrow">HUEVOS DIEZ RÍOS</div>
<div class="headline">¿NOS ROMPEN LOS HUEVOS?</div>
<div class="sub">Igual los despachamos</div>
<img class="photo" src="../fotos/sabado.jpg" alt="">
<div class="body"><div class="pill">Despacho GRATIS desde $10.000</div></div>
<div class="cta"><span>¡PIDE POR WHATSAPP!</span></div>
<div class="foot">LA SERENA Y COQUIMBO</div>
</div></body></html>
