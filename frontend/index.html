<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link id="app-favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <script>
      (() => {
        const host = window.location.hostname;
        const parts = window.location.pathname.split('/').filter(Boolean);
        const tracking = parts[0] === 'seguimiento' || (parts[0] === 'tienda' && parts[2] === 'seguimiento');
        const isAdmin = parts[0] === 'admin';
        const justo = !isAdmin && ['justocasero.com', 'www.justocasero.com', 'justocasero.cl', 'www.justocasero.cl'].includes(host);
        const diezRios = !isAdmin && ['diezrios.com', 'www.diezrios.com'].includes(host);
        const tienda = !isAdmin && parts[0] === 'tienda' && parts[1];
        const identity = justo
          ? { title: 'Justo Casero | Productos locales y precios justos', icon: '/store-assets/justo-casero/logo.png', color: '#f2644b' }
          : diezRios
            ? { title: 'Diez Ríos · Del campo a tu mesa', icon: '/store-assets/diez-rios/icono-diez-rios-oficial-v1.png', color: '#173b2b' }
            : tienda
              ? { title: 'Tienda', color: '#173b2b' }
              : { title: 'Resel', color: '#0c1a20' };
        document.title = tracking ? 'Seguimiento de tu pedido' : identity.title;
        if (tracking) {
          const referrer = document.createElement('meta');
          referrer.name = 'referrer';
          referrer.content = 'no-referrer';
          document.head.appendChild(referrer);
        }
        if (identity.icon) {
          const favicon = document.getElementById('app-favicon');
          favicon.href = identity.icon;
          favicon.type = 'image/png';
        }
        const theme = document.createElement('meta');
        theme.name = 'theme-color';
        theme.content = identity.color;
        document.head.appendChild(theme);
      })();
    </script>
    <!-- Leaflet: mapa del panel de Repartos (OpenStreetMap, sin API key) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%       { opacity: 0.6; transform: scale(1.3); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
