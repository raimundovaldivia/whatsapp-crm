# Separate project, database and volumes. Never uses backend/.env or host credentials.
name: crm-sandbox
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: crm_sandbox
      POSTGRES_PASSWORD: crm_sandbox
      POSTGRES_DB: crm_sandbox
    volumes:
      - sandbox-db:/var/lib/postgresql/data
    networks: [isolated]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U crm_sandbox -d crm_sandbox"]
      interval: 3s
      timeout: 3s
      retries: 30
  backend:
    build: ./backend
    environment:
      CRM_SANDBOX: "1"
      NODE_ENV: development
      DATABASE_URL: postgresql://crm_sandbox:crm_sandbox@db:5432/crm_sandbox
      SANDBOX_OWNER_PASSWORD: Sandbox-Local-Only-2026!
      PORT: "3001"
      FRONTEND_URL: http://localhost:8080
    networks: [isolated]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "require('net').connect(3001,'127.0.0.1').on('connect',function(){this.end();process.exit(0)}).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: same-origin
        VITE_CRM_SANDBOX: "1"
    environment:
      PORT: "8080"
    volumes:
      - ./sandbox/nginx.conf:/etc/nginx/conf.d/default.conf.template:ro
    ports: ["127.0.0.1:8080:8080"]
    networks: [isolated]
    depends_on:
      backend: { condition: service_healthy }
networks:
  isolated:
    internal: true
volumes:
  sandbox-db:
