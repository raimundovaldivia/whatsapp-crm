name: Verify Railway QA gateway
on:
  pull_request:
  push:
    branches: [infra/railway-qa]
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test railway/qa/gateway.test.cjs
