name: Publicar Despachos Android 1.4.0
on:
  push:
    branches: [release/android-prepagados-123]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 1fa78e8305a5da12cdfe45c2771330627a51740d
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Publicar la actualización del repartidor
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@24.3.0 update --platform android --channel preview --environment preview --message "Pedidos pagados sin cobro al entregar" --non-interactive
